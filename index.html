        // Get saved task progress
        function getSavedProgress() {
            return JSON.parse(localStorage.getItem('biotech_completed_tasks') || '{}');
        }

        // Toggle task checkbox
        function toggleTask(taskId, subIndex) {
            const progress = getSavedProgress();
            const key = `${taskId}_${subIndex}`;
            progress[key] = !progress[key];
            localStorage.setItem('biotech_completed_tasks', JSON.stringify(progress));
            
            updateCardState(taskId);
        }

        function updateCardState(taskId) {
            const progress = getSavedProgress();
            const cardEl = document.getElementById(`card-${taskId}`);
            if (!cardEl) return;

            const checkboxes = cardEl.querySelectorAll('.task-checkbox');
            let completedCount = 0;

            checkboxes.forEach((cb, idx) => {
                const isChecked = !!progress[`${taskId}_${idx}`];
                cb.checked = isChecked;
                const textSpan = document.getElementById(`text-${taskId}-${idx}`);
                if (textSpan) {
                    if (isChecked) {
                        textSpan.classList.add('line-through', 'text-slate-400', 'dark:text-slate-500');
                        textSpan.classList.remove('text-slate-800', 'dark:text-slate-200');
                    } else {
                        textSpan.classList.remove('line-through', 'text-slate-400', 'dark:text-slate-500');
                        textSpan.classList.add('text-slate-800', 'dark:text-slate-200');
                    }
                }
                if (isChecked) completedCount++;
            });

            if (checkboxes.length > 0 && completedCount === checkboxes.length) {
                cardEl.classList.add('opacity-40', 'grayscale-[35%]');
            } else {
                cardEl.classList.remove('opacity-40', 'grayscale-[35%]');
            }
        }

        // Universal Copy task text function (Works on Mobile + Desktop)
        function copyTask(weekNum, taskIndex) {
            const item = homeworkData[weekNum][taskIndex];
            if (!item) return;
            let textToCopy = `📚 ${item.subject} (${item.type}):\n` + item.items.join('\n');

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    alert("Текст задания скопирован!");
                }).catch(() => {
                    fallbackCopyText(textToCopy);
                });
            } else {
                fallbackCopyText(textToCopy);
            }
        }

        // Fallback for Mobile Browsers
        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            textArea.style.top = "0";
            document.body.appendChild(textArea);
            
            textArea.focus();
            textArea.select();

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    alert("Текст задания скопирован!");
                } else {
                    alert("Не удалось скопировать. Выделите текст вручную.");
                }
            } catch (err) {
                alert("Ошибка при копировании.");
            }

            document.body.removeChild(textArea);
        }

                        <i class="fa-solid fa-seedling text-4xl text-emerald-500 mb-3"></i>
                        <h3 class="pixel-font text-xs text-slate-800 dark:text-slate-200">Заданий не найдено</h3>
                        <p class="text-sm text-slate-600 dark:text-slate-400 mt-2 font-medium">Для этой недели задания ещё не загружены.</p>
                    </div>
                `;
                return;
            }

            const progress = getSavedProgress();

            tasks.forEach((item, index) => {
                const isNoTask = item.items.length === 1 && item.items[0].toLowerCase().includes("нет дз");
                const isLecture = item.type.toLowerCase().includes("лекция");

                let badgeStyle = isLecture 
                    ? "bg-purple-100 text-purple-900 border-purple-500 dark:bg-purple-950 dark:text-purple-300" 
                    : "bg-emerald-100 text-emerald-900 border-emerald-500 dark:bg-emerald-950 dark:text-emerald-300";

                const card = document.createElement("div");
                card.id = `card-${item.id}`;
                card.className = `p-5 bg-white dark:bg-slate-900 pixel-card transition-all duration-200 flex flex-col justify-between ${
                    isNoTask ? 'opacity-60 border-slate-300 dark:border-slate-800' : 'border-slate-900 dark:border-slate-800 hover:border-emerald-500'
                }`;

                // Items list with left padding (pl-3.5)
                let itemsHTML = '<div class="space-y-3 my-3 pl-3.5">';
                item.items.forEach((subTask, idx) => {
                    if (isNoTask) {
                        itemsHTML += `
                            <p class="text-sm sm:text-base italic text-slate-400 dark:text-slate-500 font-semibold">
                                ${subTask}
                            </p>
                        `;
                    } else {
                        const isChecked = !!progress[`${item.id}_${idx}`];
                        itemsHTML += `
                            <label class="flex items-start space-x-3 cursor-pointer select-none group">
                                <input type="checkbox" class="task-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleTask('${item.id}', ${idx})">
                                <span id="text-${item.id}-${idx}" class="text-sm sm:text-base font-semibold leading-relaxed transition-all ${
                                    isChecked ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-200'
                                }">
                                    ${subTask}
                                </span>
                            </label>
                        `;
                    }
                });
                itemsHTML += '</div>';

                // File Links
                let linksHTML = '';
                if (item.links && item.links.length > 0) {
                    linksHTML = `<div class="mt-4 space-y-2 pt-3 border-t-2 border-slate-100 dark:border-slate-800">`;
                    item.links.forEach(link => {
                        linksHTML += `
                            <a href="${link.url}" target="_blank" rel="noopener" class="pixel-btn inline-flex items-center gap-2 px-3.5 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs w-full transition-colors">
                                <i class="fa-solid fa-file-arrow-down text-sm"></i>
                                <span class="truncate">${link.title}</span>
                            </a>
                        `;
                    });
                    linksHTML += `</div>`;
                }

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-2">
                            <span class="text-xs font-bold px-2.5 py-0.5 border-2 ${badgeStyle} uppercase">
                                <i class="fa-solid ${item.icon || 'fa-book'} mr-1"></i> ${item.type}
                            </span>
                            <button onclick="copyTask(${week}, ${index})" class="pixel-btn px-2 py-1 bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200 hover:bg-emerald-400 hover:text-slate-950 text-xs font-bold flex items-center gap-1" title="Скопировать текст ДЗ">
                                <i class="fa-solid fa-copy"></i>
                                <span class="text-[10px] hidden sm:inline">Копировать</span>
                            </button>
                        </div>
                        <h3 class="font-bold text-base sm:text-lg text-emerald-900 dark:text-emerald-400 leading-snug mb-1">
                            ${item.subject}
                        </h3>
                        ${itemsHTML}
                    </div>
                    ${linksHTML}
                `;

                container.appendChild(card);
                if (!isNoTask) {
                    updateCardState(item.id);
                }
            });
        }

        // Tab Selection
        function selectWeek(weekNum) {
            currentWeek = weekNum;
            document.getElementById("currentWeekTitle").innerHTML = `<span>🧪</span> ${weekNum} НЕДЕЛЯ`;
            
            document.querySelectorAll(".week-tab").forEach(tab => {
                tab.className = "week-tab pixel-btn px-4 py-1.5 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-300 font-bold whitespace-nowrap text-xs";
            });
            const activeTab = document.getElementById(`tab-${weekNum}`);
            if (activeTab) {
                activeTab.className = "week-tab pixel-btn px-4 py-1.5 bg-emerald-600 text-white dark:bg-emerald-500 dark:text-slate-950 font-bold whitespace-nowrap text-xs";
            }

            renderHomework(currentWeek);
        }

        // Export/Import Sync Utility
        function exportProgress() {
            const data = localStorage.getItem('biotech_completed_tasks') || '{}';
            const encoded = btoa(data);
            const choice = prompt("Скопируйте этот код для вставки на другое устройство, или вставьте код с другого устройства сюда:", encoded);
            
            if (choice && choice !== encoded) {
                try {
                    const decoded = atob(choice);
                    JSON.parse(decoded); // Validate JSON
                    localStorage.setItem('biotech_completed_tasks', decoded);
                    alert("Галочки успешно перенесены!");
                    renderHomework(currentWeek);
                } catch(e) {
                    alert("Ошибка: Неверный код прогресса!");
                }
            }
        }

        // Theme Switcher
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeText = document.getElementById('themeText');

        function updateThemeUI(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
                if (themeText) themeText.textContent = "ТЕМНАЯ";
                localStorage.setItem('bio-theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                if (themeText) themeText.textContent = "СВЕТЛАЯ";
                localStorage.setItem('bio-theme', 'light');
            }
        }

        const savedTheme = localStorage.getItem('bio-theme');
        if (savedTheme === 'light') {
            updateThemeUI(false);
        } else {
            updateThemeUI(true);
        }

        themeToggleBtn.addEventListener('click', () => {
            const isCurrentlyDark = document.documentElement.classList.contains('dark');
            updateThemeUI(!isCurrentlyDark);
        });

        window.onload = function() {
            renderHomework(9);
        };
    </script>
</body>
</html>
